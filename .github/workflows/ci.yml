# Continuous integration — specs/ci.md.
#
# The static gate and the fast tier on GitHub's hosted runners, on every pull request and
# push to main: `check` (lint, format, types) on Linux, and `fast-tier` once per platform the
# dev environment installs on — Linux x86_64, macOS on Apple silicon, Windows x86_64 — since
# the fast tier needs no device, no network and no key, and is where each platform's install
# and code paths meet a real machine. Linux arm64 is left out: MediaPipe ships no wheel there,
# so the dev group does not install. `e2e-computer` runs the end-to-end tier's computer
# scenarios on Linux, with the two provider keys as secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Linux only (docs/reference/install.md, "System packages"). Upstream reachy-mini, pulled by
  # the bridge: PyGObject is sdist-only in the locked range and builds against the
  # girepository and cairo headers; GStreamer comes from the system (introspection data, the
  # base/good/bad plugin sets) — the bridge's own CI list. Then sounddevice's PortAudio, the
  # C++ toolchain aec-audio-processing builds with, and the GLES/EGL libraries MediaPipe loads.
  APT_PACKAGES: >-
    libgirepository1.0-dev libcairo2-dev pkg-config
    gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
    gstreamer1.0-tools
    libportaudio2
    build-essential cmake
    libgles2 libegl1
  # The cache key. The uv cache keeps, after its CI prune, only the wheels uv built itself, and
  # the ones that cost minutes are these sdist-only packages: aec-audio-processing (Linux and
  # macOS, ~2 min — its wheels are Windows-only), PyGObject and pycairo (Linux). Keying on their
  # locked entries instead of the whole uv.lock keeps the cache across sibling bumps; a new
  # sdist-only dependency joins this pattern, or it rebuilds on every run.
  SOURCE_BUILDS: '^name = "(aec-audio-processing|pygobject|pycairo)"'

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_PACKAGES
      - name: Cache key (the packages built from source)
        shell: bash
        run: grep -A3 -E "$SOURCE_BUILDS" uv.lock > .ci-source-builds
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .ci-source-builds
      - name: Sync (the dev group, against the lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright

  fast-tier:
    name: fast tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform's failure leaves the others running. macOS and Windows take GStreamer
      # from reachy-mini's wheels and ship the audio wheels, so they skip the apt step.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_PACKAGES
      - name: Cache key (the packages built from source)
        shell: bash
        run: grep -A3 -E "$SOURCE_BUILDS" uv.lock > .ci-source-builds
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .ci-source-builds
      - name: Sync (the dev group, against the lock)
        run: uv sync --locked
      - name: Fast tier
        run: uv run pytest

  e2e-computer:
    name: e2e (computer)
    # The end-to-end tier on the computer embodiment (specs/e2e.md): the real app — Claude Haiku,
    # Deepgram Flux, phonon, the hand models — with a PulseAudio null sink as the virtual cable.
    # Not a required check until its history shows it stable (specs/ci.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WICA_ANTHROPIC_API_KEY: ${{ secrets.WICA_ANTHROPIC_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      # The cable's two ends and the app's speaker, as ALSA names over PulseAudio (below).
      WICA_E2E_MIC_DEVICE: wica_mic
      WICA_E2E_PERSON_VOICE_DEVICE: wica_cable
      WICA_E2E_SPEAKER_DEVICE: wica_speaker
      # A pull request from a fork gets no secrets: it skips the scenarios. Everywhere else a
      # missing key or device fails the job instead of turning it green with nothing tested.
      WICA_E2E_FAIL_ON_MISSING: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - name: System packages (the app's, plus PulseAudio and its ALSA plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_PACKAGES pulseaudio pulseaudio-utils libasound2-plugins
      - name: Cache key (the packages built from source)
        shell: bash
        run: grep -A3 -E "$SOURCE_BUILDS" uv.lock > .ci-source-builds
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .ci-source-builds
      - name: Model cache (the hand models, the phonon voice)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-e2e-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-e2e-${{ runner.os }}-
      - name: Sync (the dev group, against the lock)
        run: uv sync --locked
      - name: The virtual cable
        # A null sink is the cable: the person plays into it, and a source remapped over its
        # monitor is the app's mic. A second null sink is the app's speaker. PortAudio, under
        # sounddevice, sees ALSA devices only, so each gets an ALSA name through the pulse plugin.
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=wica_cable
          pactl load-module module-remap-source master=wica_cable.monitor source_name=wica_mic
          pactl load-module module-null-sink sink_name=wica_speaker
          cat > ~/.asoundrc <<'ASOUND'
          pcm.wica_cable { type pulse; device "wica_cable" }
          pcm.wica_mic { type pulse; device "wica_mic" }
          pcm.wica_speaker { type pulse; device "wica_speaker" }
          ASOUND
          uv run python -c "import sounddevice as sd; print(sd.query_devices())"
      - name: End-to-end, computer
        run: uv run pytest tests-e2e/test_computer.py -v -rs --basetemp=${{ runner.temp }}/e2e
      - name: Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-computer-evidence
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
