[project]
name = "wica-interaction"
version = "0.1.0"
description = "A WICA interaction application: a person speaks to a WICA agent, which speaks (and acts) back through the embodiment it is launched with — the computer it runs on, or a Reachy Mini robot."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
# What every embodiment needs: the agent + its Gradio observability panels, speech in, the vision
# plumbing, the page. `vision-modules` core is numpy only — the stream/pipeline runtime and the
# `FrameLike` protocol gesture_input.py imports; OpenCV and its heavy models are the `vision`
# extra below. `numpy` is imported directly by gesture_input.py.
dependencies = [
    "wica[gradio]",
    "asr-engine",
    "vision-modules",
    "gradio>=6",
    "numpy",
]

[project.optional-dependencies]
# One extra per embodiment, per optional feature, per provider (specs/project.md, "Extras"), so a
# deployment installs only what it runs and a missing one surfaces as a banner line, not a crash.
# The computer embodiment's voice: a local TTSEngine through the machine's speakers.
computer = ["tts-engine"]
# The computer's WebRTC echo cancellation / noise suppression (specs/audio-processing.md).
audio-processing = ["aec-audio-processing>=1.0.1", "samplerate>=0.2.4"]
# The Reachy Mini embodiment (pulls the upstream reachy-mini SDK through the bridge).
reachy = ["reachy-mini-bridge"]
# The MuJoCo simulator the `sim` robot backend runs on, the bridge's own `sim` extra: its own extra,
# not part of `reachy`, because a deployment on a real robot needs none of it.
reachy-sim = ["reachy-mini-bridge[sim]"]
# The hand-sign input, either embodiment: MediaPipe + the torch/transformers HaGRID classifier, and
# the library's `opencv` extra for its webcam source (the computer's camera) and its snapshot
# writer (the Vision snapshot buttons) — both imported lazily, only when that feature runs.
vision = ["vision-modules[hand,opencv]"]
# The agent providers, one extra per WICA provider extra, all interchangeable: a config selects
# one by its `provider` name, either embodiment.
wica-anthropic = ["wica[anthropic]"]
wica-huggingface-hub = ["wica[huggingface-hub]"]
wica-openai = ["wica[openai]"]
wica-google-genai = ["wica[google-genai]"]
wica-mistralai = ["wica[mistralai]"]
# The speech-in provider. asr-engine's other two, `kyutai-mlx` and `kyutai-torch`, are not
# mirrored: their `moshi-mlx` / `moshi` pin numpy<2.3, which the base's vision-modules
# (numpy>=2.5.3) rules out, so declaring either makes the lock unsolvable.
asr-deepgram = ["asr-engine[deepgram]"]
# The voices, for *both* embodiments (the bridge builds the robot's voice from the same
# tts-engine): one extra per tts-engine provider extra, so the engine's "install
# tts-engine[<name>]" hint always has a `tts-<name>` here. Hosted providers first, then the
# local models (pocket: torch + a first-run weight download; qwen3: Apple silicon only, gated by
# tts-engine's own marker; piper: GPL-3.0+).
tts-elevenlabs = ["tts-engine[elevenlabs]"]
tts-gradium = ["tts-engine[gradium]"]
tts-mistral = ["tts-engine[mistral]"]
tts-deepgram = ["tts-engine[deepgram]"]
tts-gemini = ["tts-engine[gemini]"]
tts-cartesia = ["tts-engine[cartesia]"]
tts-openai = ["tts-engine[openai]"]
tts-openai-compatible = ["tts-engine[openai-compatible]"]
tts-pocket = ["tts-engine[pocket]"]
tts-phonon = ["tts-engine[phonon]"]
tts-qwen3 = ["tts-engine[qwen3]"]
tts-kokoro = ["tts-engine[kokoro]"]
tts-piper = ["tts-engine[piper]"]
all = [
    "wica-interaction[computer,audio-processing,reachy,reachy-sim,vision]",
    "wica-interaction[wica-anthropic,wica-huggingface-hub,wica-openai,wica-google-genai,wica-mistralai]",
    "wica-interaction[asr-deepgram]",
    "wica-interaction[tts-elevenlabs,tts-gradium,tts-mistral,tts-deepgram,tts-gemini,tts-cartesia,tts-openai,tts-openai-compatible]",
    "wica-interaction[tts-pocket,tts-phonon,tts-qwen3,tts-kokoro,tts-piper]",
]

[project.scripts]
wica-interaction-computer = "wica_interaction.computer.app:main"
wica-interaction-reachy = "wica_interaction.reachy.app:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    # What the example configs and the test tier run, not `all`: both embodiments and their
    # features, every (light) agent provider, and the speech providers the example configs select.
    # The other speech providers are resolved by `uv lock` all the same, just not installed.
    "wica-interaction[computer,audio-processing,reachy,vision]",
    "wica-interaction[wica-anthropic,wica-huggingface-hub,wica-openai,wica-google-genai,wica-mistralai]",
    "wica-interaction[asr-deepgram,tts-elevenlabs,tts-gradium,tts-pocket]",
    # The simulator, what the reachy template targets, for manual/e2e testing against a simulated
    # robot.
    "wica-interaction[reachy-sim]",
]

[tool.uv.sources]
# Self-reference for the `dev` group above, which pulls the package's own extras.
wica-interaction = { workspace = true }
# First-party sibling repos, every one from GitHub, `rev = "main"`: the lock records the exact
# commit each resolved to, and `uv lock --upgrade-package <name>` moves it (specs/project.md,
# "Sibling sources"). No local path dependency: an install needs no checkout next door.
# `tts-engine`'s URL is the bridge's own requirement verbatim (`tts-engine @ git+https://github.com/
# funwithagents/tts-engine@main`) — uv refuses two different URLs for one package, and `rev`
# (not `branch`) is what makes the two references identical, so the graph resolves without an
# override.
wica = { git = "https://github.com/funwithagents/wica-framework", rev = "main" }
asr-engine = { git = "https://github.com/funwithagents/asr-engine", rev = "main" }
tts-engine = { git = "https://github.com/funwithagents/tts-engine", rev = "main" }
reachy-mini-bridge = { git = "https://github.com/funwithagents/reachy-mini-bridge", rev = "main" }
vision-modules = { git = "https://github.com/funwithagents/vision-modules", rev = "main" }
# PyPI's Linux torch wheel is the CUDA build and drags gigabytes of NVIDIA libraries; on Linux
# torch resolves from PyTorch's CPU index instead, the same choice as the siblings that pull it
# (`vision-modules[hand]`, `tts-engine[pocket]`). `explicit`: only `torch` comes from there.
# macOS and Windows keep PyPI's wheel, CPU-only there. Declared here because a dependency's
# own index choice is not something a consumer can rely on inheriting.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# reachy-mini (a reachy-mini-bridge dependency) gates PyGObject to Linux (macOS/Windows use the
# self-contained gstreamer-bundle). PyGObject/pycairo are sdist-only in the pinned range, so uv's
# universal lock would try to *build* them on a non-Linux host just to read their metadata (needs
# system cairo) and fail. Declaring their metadata lets uv resolve the Linux side of the lock
# without building them; markers still keep them off non-Linux installs. (Mirrors the bridge's own
# pyproject, since a dependency's `[tool.uv]` settings are not inherited.)
dependency-metadata = [
    { name = "pygobject", version = "3.46.0", requires-dist = ["pycairo>=1.16.0"] },
    { name = "pycairo", version = "1.29.1" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
