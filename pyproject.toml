[project]
name = "reachy-mini-interaction-wica"
version = "0.1.0"
description = "An interaction application for the Reachy Mini robot, built on the WICA agentic framework and driving the robot through reachy-mini-bridge."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
dependencies = [
    # Speech in: the app runs its own ASR over the robot's echo-cancelled mic stream (the bridge
    # embeds no ASR — see reachy-mini-bridge specs/audio.md). Providers are extras upstream; the
    # `deepgram` extra matches the committed config.example.json (asr type "deepgram_v2").
    "asr-engine[deepgram]",
    # The robot: high-level interaction verbs (say, mic stream, play_emotion, head tracking, motors)
    # over a real/sim/fake Reachy Mini. The bridge owns its own config (ReachyMiniConfig) and builds
    # the voice itself from the `reachy.tts` block, on a tts-engine it carries as a base dependency.
    # Its TTS providers are extras mirroring tts-engine's own one-to-one, so the extra to install is
    # named by `reachy.tts.module.type`: `tts-pocket` matches the committed config.example.json
    # (type "pocket") — the local model, no key and no network at synthesis time. Switching the
    # config to the cloud provider means swapping this for `[tts-elevenlabs]`.
    "reachy-mini-bridge[tts-pocket]",
    # The anthropic extra pulls langchain-anthropic so the committed config.example.json (provider
    # "anthropic") runs with just an API key set. Switch provider by editing the config and swapping
    # that extra (see wica's optional-dependencies: openai, huggingface-hub). The gradio extra is not
    # a provider: it makes `wica.contrib.gradio` importable — the reusable observability panels the
    # UI places (core wica never imports Gradio).
    "wica[anthropic,gradio]",
    # Vision in: the hand stage + gesture classifier that turn the robot's camera frames into the
    # fist gesture input (specs/gesture-input.md). The `hand` extra pulls mediapipe (hand detection)
    # and torch/transformers (the HaGRID ViT classifier); the core package is numpy + opencv only.
    "vision-modules[hand]",
    "gradio>=6",
]

[project.scripts]
reachy-mini-interaction-wica = "reachy_mini_interaction_wica.app:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    # The reachy-mini-bridge `sim` extra pulls the upstream MuJoCo mockup so the `sim` robot backend
    # runs locally (dev/manual testing against a simulated robot). Kept dev-only — a real-robot
    # deployment needs none of it — mirroring the bridge's own dev setup.
    "reachy-mini-bridge[sim]",
]

[tool.uv.sources]
# First-party sibling repos, consumed as local path dependencies during development (a pinned git
# URL later, per specs/project.md). They live in the parent folder. There is deliberately no
# tts-engine entry: the bridge names it by GitHub URL as a *direct reference* in its own metadata,
# which uv sources cannot redirect from here — a path entry would either be ignored (sources reach
# only this project's own dependencies, not transitive ones) or, if tts-engine were re-declared
# directly, fail the resolve with "conflicting URLs for package `tts-engine`". So tts-engine
# resolves from GitHub and the lock pins its commit; `uv lock --upgrade-package tts-engine` picks
# up newer ones. To drive a local checkout here, add an uncommitted
# `[tool.uv] override-dependencies = ["tts-engine[pocket] @ file:///abs/path/to/tts-engine"]`
# (the extra must be repeated there — an override replaces the whole requirement).
wica = { path = "../wica-framework", editable = true }
asr-engine = { path = "../asr-engine", editable = true }
reachy-mini-bridge = { path = "../reachy-mini-bridge", editable = true }
vision-modules = { path = "../vision-modules", editable = true }

[tool.uv]
# reachy-mini (a reachy-mini-bridge dependency) gates PyGObject to Linux (macOS/Windows use the
# self-contained gstreamer-bundle). PyGObject/pycairo are sdist-only in the pinned range, so uv's
# universal lock would try to *build* them on a non-Linux host just to read their metadata (needs
# system cairo) and fail. Declaring their metadata lets uv resolve the Linux side of the lock
# without building them; markers still keep them off non-Linux installs. (Mirrors the bridge's own
# pyproject, since path deps don't inherit `[tool.uv]` settings.)
dependency-metadata = [
    { name = "pygobject", version = "3.46.0", requires-dist = ["pycairo>=1.16.0"] },
    { name = "pycairo", version = "1.29.1" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
